name: Release

on:
  push:
    tags: ['[0-9]*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Package plugin
        working-directory: dist
        run: zip "../sparse-sort-$RELEASE_TAG.zip" main.js manifest.json styles.css LICENSE
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/main.js dist/manifest.json dist/styles.css dist/LICENSE
          "sparse-sort-$RELEASE_TAG.zip"
          --verify-tag --title "Sparse Sort $RELEASE_TAG"
          --notes-file "releases/$RELEASE_TAG.md" --latest
